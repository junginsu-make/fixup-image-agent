name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm -r typecheck

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Locate PostgreSQL binaries
        shell: bash
        run: |
          pg_bin=$(pg_config --bindir)
          test -x "$pg_bin/initdb"
          echo "TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Isolated database and deployment integration
        run: node --test scripts/tests/*.test.mjs
