name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm -r typecheck

      - name: Verify release recovery and fal route durability
        shell: bash
        run: |
          export TEST_PG_BIN="$(pg_config --bindir)"
          pnpm test:readiness-fixes
          node --test scripts/tests/member-delete-repair.test.mjs
