name: Browser security runtime
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://studio.example.test:8443
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.test:8443
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: fixture-site-key
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/ingest-core exec playwright install --with-deps chromium
      - run: pnpm build:ec2
      - name: Resolve isolated TLS fixtures for both Node and Edge runtimes
        run: echo '127.0.0.1 studio.example.test supabase.example.test' | sudo tee -a /etc/hosts > /dev/null
      - run: node scripts/smoke-web-security.mjs dist/ec2
      - name: Package the verified isolated runtime for the next stage
        run: tar -czf "$RUNNER_TEMP/security-runtime.tar.gz" -C dist/ec2 .
      - uses: actions/upload-artifact@v7
        with:
          name: fixup-security-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/security-runtime.tar.gz
          retention-days: 1
