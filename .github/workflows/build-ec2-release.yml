name: Build EC2 release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

# Verification and isolated DB integration must pass before building or publishing.

env:
  PNPM_VERSION: 9.15.9
  NODE_VERSION: 22

jobs:
  # ── 검사 ─────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s pnpm audit --prod --audit-level=high

      - name: Regression tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ── 빌드 ─────────────────────────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Locate PostgreSQL binaries
        shell: bash
        run: |
          pg_bin=$(pg_config --bindir)
          test -x "$pg_bin/initdb"
          echo "TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Isolated database and deployment integration
        run: node --test scripts/tests/*.test.mjs

  build:
    needs: [verify, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify public production variables
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_TURNSTILE_SITE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions variable: ${name}" >&2
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux standalone runtime
        run: pnpm build:ec2

      - name: Verify runtime contents
        shell: bash
        run: |
          test -f dist/ec2/apps/web/server.js
          test -f dist/ec2/ops/generation-tick.mjs
          node --check dist/ec2/ops/generation-tick.mjs
          node scripts/verify-generation-release.mjs dist/ec2
          node scripts/smoke-generation-release.mjs dist/ec2
          if find dist/ec2 -name '.env*' -print -quit | grep -q .; then
            echo 'Runtime artifact contains an .env file.' >&2
            exit 1
          fi
          # 링크 자체는 있어야 한다 — pnpm 이 그 구조로 모듈을 해석한다.
          # 막아야 하는 것은 러너의 절대 경로를 가리키는 링크다. 그런 아티팩트가
          # 운영까지 갔다가 "Cannot find module 'next'" 로 죽었다(2026-07-28).
          if find dist/ec2 -type l -lname '/*' -print -quit | grep -q .; then
            echo 'Runtime artifact has absolute symlinks:' >&2
            find dist/ec2 -type l -lname '/*' -printf '  %p -> %l\n' | head -10 >&2
            exit 1
          fi
          # 끊어진 링크도 막는다.
          if find dist/ec2 -type l ! -exec test -e {} \; -print -quit | grep -q .; then
            echo 'Runtime artifact has broken symlinks:' >&2
            find dist/ec2 -type l ! -exec test -e {} \; -printf '  %p -> %l\n' | head -10 >&2
            exit 1
          fi
          # 실행에 꼭 필요한 모듈에 실제로 도달하는지 확인한다.
          test -f dist/ec2/apps/web/node_modules/next/package.json
          tar -czf fixup-image-agent-${GITHUB_SHA::12}.tar.gz -C dist/ec2 .
          tar -czf fixup-image-agent-ops-${GITHUB_SHA::12}.tar.gz deploy/ec2

      # 꾸러미의 **본 배송지**는 릴리스다.
      #
      # 2026-09-09 배포가 여기서 막혔다 — 「Artifact storage quota has been
      # hit」. 빌드는 멀쩡히 끝났는데 56MB 짜리 꾸러미 90개가 4.3GB 를 채우고
      # 있었다. 오래된 것을 지워도 용량은 6~12시간마다 다시 계산되어 그날
      # 배포를 못 했다. 릴리스 자산은 그 한도와 별개다.
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="release-${GITHUB_SHA::12}"
          gh release create "$tag"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$tag"             --notes "자동 빌드 — ${GITHUB_SHA}"             fixup-image-agent-*.tar.gz

      # 아티팩트는 곁다리로 남긴다. 용량에 걸려도 **배포를 막지 않는다.**
      - name: Upload release artifacts (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: fixup-image-agent-ec2-${{ github.sha }}
          path: |
            fixup-image-agent-*.tar.gz
          if-no-files-found: error
          # 14일이면 90개가 쌓인다. 릴리스가 본 배송지이니 짧게 잡는다.
          retention-days: 3
