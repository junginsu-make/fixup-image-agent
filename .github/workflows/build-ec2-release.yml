name: Build EC2 release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

# 검사와 빌드를 **나란히** 돌린다.
#
# 한 줄로 이어 붙였더니 2026-09-04 배포가 9분 41초 걸렸다. 재 보니 진짜 빌드는
# 1분 54초뿐이고, 나머지 8분이 준비와 검사였다 — 감사 4분 11초, pnpm 설치
# 2분 32초, 타입 검사 41초.
#
# 감사와 타입 검사는 빌드 결과를 안 쓴다. 기다릴 이유가 없다. 나란히 돌리면
# 벽시계 시간이 둘의 합이 아니라 **더 오래 걸리는 쪽**이 된다.
#
# 검사를 빼지는 않는다. 둘 중 하나라도 실패하면 워크플로가 실패로 끝나고,
# 배포는 성공한 실행에서만 꾸러미를 내려받는다.

env:
  PNPM_VERSION: 9.15.9
  NODE_VERSION: 22

jobs:
  # ── 검사 ─────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        shell: bash
        run: |
          # 취약점이 있으면 막는다. 그건 우리 문제다.
          #
          # 그런데 `pnpm audit` 은 **감사 서버에 못 닿을 때도 같은 실패**를
          # 낸다. 2026-09-04 registry.npmjs.org 가 응답하지 않아 배포가 두 번
          # 막혔다 — 의존성에는 아무 문제가 없었는데도. 둘을 갈라 본다.
          #
          # 시간도 못 박는다. 같은 날 이 단계가 혼자 4분 11초를 썼다. 닿지
          # 않는 서버를 하염없이 기다리느라 쓴 시간이다. 2분을 넘기면 「닿지
          # 못했다」로 보고 넘어간다 — 취약점을 못 본 것과 서버가 죽은 것을
          # 가르는 이 판단은 아래 문자열 검사와 같은 뜻이다.
          set +e
          out=$(timeout 120s pnpm audit --prod --audit-level=high 2>&1)
          code=$?
          echo "$out"
          if [[ $code -eq 0 ]]; then exit 0; fi
          if [[ $code -eq 124 ]]; then
            echo "::warning::npm 감사 서버가 2분 안에 답하지 않아 취약점 검사를 건너뜁니다. 의존성 문제가 아닙니다."
            exit 0
          fi
          if grep -qiE 'ERR_SOCKET_TIMEOUT|FetchError|socket timeout|ENOTFOUND|ECONNRESET|EAI_AGAIN|ERR_PNPM_AUDIT_ENDPOINT' <<<"$out"; then
            echo "::warning::npm 감사 서버에 닿지 못해 취약점 검사를 건너뜁니다. 의존성 문제가 아닙니다."
            exit 0
          fi
          exit $code

      - name: Typecheck
        run: pnpm typecheck

  # ── 빌드 ─────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify public production variables
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_TURNSTILE_SITE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions variable: ${name}" >&2
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux standalone runtime
        run: pnpm build:ec2

      - name: Verify runtime contents
        shell: bash
        run: |
          test -f dist/ec2/apps/web/server.js
          if find dist/ec2 -name '.env*' -print -quit | grep -q .; then
            echo 'Runtime artifact contains an .env file.' >&2
            exit 1
          fi
          # 링크 자체는 있어야 한다 — pnpm 이 그 구조로 모듈을 해석한다.
          # 막아야 하는 것은 러너의 절대 경로를 가리키는 링크다. 그런 아티팩트가
          # 운영까지 갔다가 "Cannot find module 'next'" 로 죽었다(2026-07-28).
          if find dist/ec2 -type l -lname '/*' -print -quit | grep -q .; then
            echo 'Runtime artifact has absolute symlinks:' >&2
            find dist/ec2 -type l -lname '/*' -printf '  %p -> %l\n' | head -10 >&2
            exit 1
          fi
          # 끊어진 링크도 막는다.
          if find dist/ec2 -type l ! -exec test -e {} \; -print -quit | grep -q .; then
            echo 'Runtime artifact has broken symlinks:' >&2
            find dist/ec2 -type l ! -exec test -e {} \; -printf '  %p -> %l\n' | head -10 >&2
            exit 1
          fi
          # 실행에 꼭 필요한 모듈에 실제로 도달하는지 확인한다.
          test -f dist/ec2/apps/web/node_modules/next/package.json
          tar -czf fixup-image-agent-${GITHUB_SHA::12}.tar.gz -C dist/ec2 .
          tar -czf fixup-image-agent-ops-${GITHUB_SHA::12}.tar.gz deploy/ec2

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fixup-image-agent-ec2-${{ github.sha }}
          path: |
            fixup-image-agent-*.tar.gz
          if-no-files-found: error
          retention-days: 14
