<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  동봉한 서체를 fontconfig 가 보게 한다.

  운영 서버에 깔린 한글 폰트는 fallback 하나뿐이라 서체를 고를 수 없다.
  systemd 유닛에서 이렇게 가리킨다.

    FONTCONFIG_FILE=/opt/fixup-image-agent/current/apps/web/assets/fonts/fonts.conf

  합성 코드는 그리는 순간 폰트 파일 경로를 직접 넘기므로(`lib/layout/fonts.ts`)
  이 파일이 없어도 카드는 나온다. 다만 시스템 설정만 남으면 fallback 서체로
  그려진다.
-->
<fontconfig>
  <!-- 시스템 설정을 먼저 읽는다. 이것을 빼면 기본 서체·힌팅까지 사라진다. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- 이 설정 파일이 있는 폴더. 릴리스를 어디에 풀어도 그대로 맞는다. -->
  <dir prefix="relative">.</dir>

  <!--
    쓸 수 있는 캐시 폴더가 없으면 매번 폰트를 다시 훑는다. 카드 10장이면
    열 번이다. systemd 유닛의 XDG_CACHE_HOME 이 가리키는 자리를 먼저 쓰고,
    없으면 /tmp 로 떨어진다.
  -->
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
