<!doctype html>
<html lang="ko" data-accent="green" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UI 개편 미리보기 — AI 상세페이지 스튜디오</title>
<style>
:root{
  --parchment:#f5f4ed; --ivory:#faf9f5; --ink:#141413;
  --olive:#5e5d59; --stone:#87867f; --border-warm:#e8e6dc;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  --ring:0 0 0 1px var(--border-warm);
  --elevate:0 4px 24px rgba(0,0,0,.05);
  --bg:var(--parchment); --card:var(--ivory); --fg:var(--ink);
  --muted:var(--olive); --meta:var(--stone); --line:var(--border-warm);
}
:root[data-accent="green"]{ --accent:#157f6e; --accent-soft:rgba(21,127,110,.10); --accent-ring:rgba(21,127,110,.35); }
:root[data-accent="terracotta"]{ --accent:#c96442; --accent-soft:rgba(201,100,66,.10); --accent-ring:rgba(201,100,66,.35); }
:root[data-theme="dark"]{
  --bg:#1c1b19; --card:#26251f; --fg:#eceae2;
  --muted:#a8a69c; --meta:#8a887f; --line:#3a382f;
  --ring:0 0 0 1px var(--line); --elevate:0 4px 24px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.controls{
  position:sticky; top:0; z-index:60; display:flex; gap:18px; align-items:center; flex-wrap:wrap;
  padding:10px 20px; background:var(--card); border-bottom:1px solid var(--line);
}
.controls b{font-size:12px; color:var(--meta); font-weight:700}
.seg{display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px 12px;border-radius:999px;font:inherit;font-size:12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
.note{margin-left:auto; font-size:12px; color:var(--meta)}

.app{display:grid; grid-template-columns:clamp(236px,15vw,300px) 1fr; min-height:calc(100vh - 49px)}
.side{border-right:1px solid var(--line); background:var(--card); padding:18px 14px;
  display:flex; flex-direction:column; gap:22px; position:sticky; top:49px; height:calc(100vh - 49px)}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);flex:none}
.brand span{font-weight:800;letter-spacing:-.01em}
.grp>p{margin:0 6px 8px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--meta)}
.step{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;
  border:0;border-radius:var(--radius-md);background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.step:hover{background:var(--bg)}
.step[aria-current="true"]{background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent-ring)}
.step .n{flex:none;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:800;
  display:grid;place-items:center;background:var(--bg);color:var(--meta);border:1px solid var(--line)}
.step[aria-current="true"] .n{background:var(--accent);color:#fff;border-color:transparent}
.step.done .n{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.step .t{display:block;font-weight:700;font-size:13px}
.step .d{display:block;font-size:11px;color:var(--meta);margin-top:1px}
.side .bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px}

.main{padding:26px clamp(20px,2.2vw,52px) 96px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.h1{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted)}
.head .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.small{font-size:11px;font-weight:800;color:var(--meta)}

.two{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,20vw,400px);gap:16px;align-items:start}
.rail{position:sticky;top:69px;display:grid;gap:16px}

/* ── 격자 보기 ── */
.grid{display:grid;gap:16px}
:root[data-size="s"] .grid{grid-template-columns:repeat(auto-fill,minmax(clamp(190px,12vw,240px),1fr))}
:root[data-size="m"] .grid{grid-template-columns:repeat(auto-fill,minmax(clamp(240px,16vw,320px),1fr))}
:root[data-size="l"] .grid{grid-template-columns:repeat(auto-fill,minmax(clamp(320px,24vw,460px),1fr))}
.card{background:var(--card);border-radius:var(--radius-lg);padding:12px;box-shadow:var(--ring)}
.card h3{margin:0 0 2px;font-size:13px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:12px}
.shot{
  position:relative; border-radius:var(--radius-md); overflow:hidden; margin-bottom:10px;
  border:1px solid var(--line); background:#fff; cursor:zoom-in; display:block; width:100%; padding:0;
}
:root[data-theme="dark"] .shot{background:#f5f4ed}
.shot .zoom{
  position:absolute; right:8px; bottom:8px; z-index:2; font-size:11px; font-weight:800;
  background:rgba(20,20,19,.72); color:#fff; padding:4px 9px; border-radius:999px;
  opacity:0; transition:opacity .15s;
}
.shot:hover .zoom{opacity:1}
.row{display:flex;align-items:center;gap:8px;margin-top:10px}
.chip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.plain{background:var(--bg);color:var(--meta);box-shadow:var(--ring)}
.btn{border:0;border-radius:var(--radius-sm);padding:8px 13px;font:inherit;font-weight:800;font-size:12px;
  cursor:pointer;background:var(--bg);color:var(--fg);box-shadow:var(--ring)}
.btn:hover{background:var(--card)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.spacer{flex:1}

/* ── 이어보기(최종 결과물 모습) ── */
.stitch{display:none; justify-content:center}
:root[data-view="stitch"] .stitch{display:flex}
:root[data-view="stitch"] .grid{display:none}
:root[data-view="grid"] .stitch{display:none}
.page{
  width:min(760px,100%); background:#fff; border:1px solid var(--line);
  border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--ring),var(--elevate);
}
.page .seam{position:relative}
.page .seam+.seam{border-top:1px dashed rgba(21,127,110,.28)}
.page .seam .tag{
  position:absolute; left:8px; top:8px; z-index:2; font-size:10px; font-weight:800;
  background:var(--accent); color:#fff; padding:3px 8px; border-radius:999px; opacity:.9;
}

/* ── 모의 섹션 이미지(실제 상세페이지처럼 글자가 들어간 세로 이미지) ── */
.mock{width:100%; display:block}

.panel{background:var(--card);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--ring)}
.panel h4{margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--meta)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:7px 13px;border-radius:999px;background:var(--bg);color:var(--fg);box-shadow:var(--ring);
  font-size:12px;font-weight:700;cursor:pointer;border:0;font-family:inherit}
.opt[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.list{display:grid;gap:6px}
.li{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--radius-sm);background:var(--bg);box-shadow:var(--ring);font-size:12px}
.li .h{width:6px;height:6px;border-radius:99px;background:var(--accent);flex:none}
.li .g{margin-left:auto;color:var(--meta);cursor:grab}

.actionbar{position:fixed;left:clamp(236px,15vw,300px);right:0;bottom:0;z-index:40;display:flex;align-items:center;
  gap:12px;padding:12px clamp(20px,2.2vw,52px);background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);font-weight:700}
.bar{width:130px;height:5px;border-radius:99px;background:var(--bg);overflow:hidden;box-shadow:var(--ring)}
.bar i{display:block;height:100%;width:62%;background:var(--accent);border-radius:99px}

/* ── 크게 보기 모달 ── */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:80;display:grid;grid-template-rows:auto 1fr;background:rgba(20,20,19,.82);backdrop-filter:blur(3px)}
.mbar{display:flex;align-items:center;gap:12px;padding:12px 18px;color:#fff}
.mbar .t{font-weight:800}
.mbar .m{color:rgba(255,255,255,.62);font-size:12px}
.mbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:var(--radius-sm);
  padding:8px 13px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.mbtn:hover{background:rgba(255,255,255,.24)}
.mbtn.primary{background:var(--accent)}
.mbody{overflow:auto;padding:0 18px 26px;display:grid;justify-items:center}
.mbody .sheet{width:min(820px,100%);background:#fff;border-radius:var(--radius-md);overflow:hidden}
.mnav{position:fixed;top:50%;transform:translateY(-50%);z-index:81;border:0;cursor:pointer;
  width:44px;height:44px;border-radius:99px;background:rgba(255,255,255,.16);color:#fff;font-size:20px}
.mnav:hover{background:rgba(255,255,255,.28)}
.mnav.prev{left:14px} .mnav.next{right:14px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}.side{display:none}.actionbar{left:0}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="controls">
  <b>보기</b>
  <div class="seg" id="view">
    <button data-v="grid" aria-pressed="true">격자</button>
    <button data-v="stitch" aria-pressed="false">이어보기</button>
  </div>
  <b>카드 크기</b>
  <div class="seg" id="size">
    <button data-v="s" aria-pressed="false">작게</button>
    <button data-v="m" aria-pressed="true">보통</button>
    <button data-v="l" aria-pressed="false">크게</button>
  </div>
  <b>테마</b>
  <div class="seg" id="theme">
    <button data-v="light" aria-pressed="true">라이트</button>
    <button data-v="dark" aria-pressed="false">다크</button>
  </div>
  <span class="note">카드를 클릭하면 크게 열립니다 · ← → 이동 · Esc 닫기</span>
</div>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="dot"></div><span>AI 상세페이지 스튜디오</span></div>
    <div class="grp">
      <p>새로 만들기</p>
      <button class="step done"><span class="n">✓</span><span><span class="t">이미지 업로드</span><span class="d">상품 사진 1장</span></span></button>
      <button class="step done"><span class="n">✓</span><span><span class="t">AI 분석</span><span class="d">구성 초안 생성</span></span></button>
      <button class="step" aria-current="true"><span class="n">3</span><span><span class="t">섹션 생성</span><span class="d">이미지 만들기</span></span></button>
      <button class="step"><span class="n">4</span><span><span class="t">편집 · 내보내기</span><span class="d">문구 · 레이어</span></span></button>
    </div>
    <div class="grp">
      <p>도구</p>
      <button class="step"><span class="n">↻</span><span><span class="t">리디자인</span><span class="d">기존 페이지 개선</span></span></button>
      <button class="step"><span class="n">▤</span><span><span class="t">라이브러리</span><span class="d">저장한 작업</span></span></button>
    </div>
    <div class="bottom">
      <button class="step"><span class="n">⚙</span><span class="t">설정</span></button>
      <button class="step"><span class="n">?</span><span class="t">이용 안내</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="head">
      <div>
        <h1 class="h1">섹션 생성</h1>
        <p class="sub">섹션 수는 상품에 따라 달라집니다. 카드를 클릭하면 크게 볼 수 있고, <b>이어보기</b>로 최종 모습을 확인하세요.</p>
      </div>
      <div class="right"><span class="small">총 9개 섹션</span></div>
    </div>

    <div class="two">
      <div>
        <div class="grid" id="grid"></div>
        <div class="stitch"><div class="page" id="page"></div></div>
      </div>

      <div class="rail">
        <div class="panel">
          <h4>섹션 순서</h4>
          <div class="list" id="order"></div>
          <p style="margin:10px 0 0;font-size:11px;color:var(--meta)">끌어서 순서를 바꾸고, 섹션을 추가·삭제할 수 있습니다.</p>
        </div>
        <div class="panel">
          <h4>원하는 톤</h4>
          <div class="opts">
            <button class="opt" aria-pressed="true">AI 자동 추천</button>
            <button class="opt">프리미엄</button><button class="opt">모던</button><button class="opt">미니멀</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="actionbar">
  <span class="prog"><span class="bar"><i></i></span><span id="done">6 / 9 섹션 완료</span></span>
  <span class="spacer"></span>
  <button class="btn">← 분석으로</button>
  <button class="btn primary">편집으로 →</button>
</div>

<div class="modal" id="modal" hidden>
  <div class="mbar">
    <span class="t" id="mtitle">히어로</span>
    <span class="m" id="mmeta">1 / 9 · 860 × 1200</span>
    <span class="spacer"></span>
    <button class="mbtn">다시 생성</button>
    <button class="mbtn primary">이 섹션 편집</button>
    <button class="mbtn" id="mclose">닫기 ✕</button>
  </div>
  <div class="mbody"><div class="sheet" id="msheet"></div></div>
  <button class="mnav prev" id="mprev">‹</button>
  <button class="mnav next" id="mnext">›</button>
</div>

<script>
// 실제 상세페이지 섹션처럼 "세로로 길고 글자가 들어간" 이미지를 SVG로 흉내낸다.
const SECTIONS = [
  {t:"히어로",         d:"첫인상을 결정하는 대표 컷", h:1200, big:"단 하나의 기준",      sub:"매일 쓰는 물건일수록"},
  {t:"핵심 가치",       d:"구매 이유 3가지",         h:1000, big:"왜 다른가",          sub:"3가지 이유"},
  {t:"상세 스펙",       d:"치수 · 소재 · 구성",       h:1400, big:"정확한 수치",        sub:"치수 · 소재 · 무게"},
  {t:"사용 장면",       d:"실제 쓰임새 연출",         h:1100, big:"이렇게 씁니다",      sub:"하루의 흐름 속에서"},
  {t:"디테일 컷",       d:"마감 · 질감 클로즈업",      h:900,  big:"가까이 보면",        sub:"마감이 말해줍니다"},
  {t:"색상 옵션",       d:"컬러 3종 비교",           h:800,  big:"3가지 색",           sub:"어디에나 어울리는"},
  {t:"사이즈 가이드",    d:"체형별 권장 사이즈",        h:1300, big:"사이즈 가이드",      sub:"고민 없이 고르세요", pending:true},
  {t:"자주 묻는 질문",   d:"배송 · 교환 · 세탁",       h:1000, big:"자주 묻는 질문",     sub:"미리 답해드립니다", pending:true},
  {t:"브랜드 스토리",    d:"마무리 메시지",           h:1100, big:"오래 쓰이길",        sub:"그래서 이렇게 만듭니다", pending:true},
];

let __gid = 0;
function mock(s, w){
  // SVG id 에 한글·공백이 들어가면 무효라 fill 이 깨진다. 호출마다 고유 숫자 id 를 쓴다.
  const gid = "grad" + (++__gid);
  const h = Math.round(w * s.h / 860);
  const lines = [];
  let y = Math.round(h*0.56);
  for (let i=0;i<6;i++){ lines.push(`<rect x="${w*0.12}" y="${y}" width="${w*(0.76-i*0.06)}" height="${h*0.012}" rx="${h*0.006}" fill="#141413" opacity=".16"/>`); y += h*0.035; }
  return `<svg class="mock" viewBox="0 0 ${w} ${h}" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${s.t} 섹션 미리보기">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f0"/><stop offset="1" stop-color="#f7f5ef"/></linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#${gid})"/>
    <rect x="${w*0.12}" y="${h*0.10}" width="${w*0.76}" height="${h*0.34}" rx="${w*0.02}" fill="#141413" opacity=".07"/>
    <text x="${w*0.12}" y="${h*0.50}" font-family="Pretendard,sans-serif" font-size="${Math.round(h*0.045)}" font-weight="800" fill="#141413">${s.big}</text>
    <text x="${w*0.12}" y="${h*0.535}" font-family="Pretendard,sans-serif" font-size="${Math.round(h*0.022)}" fill="#5e5d59">${s.sub}</text>
    ${lines.join("")}
  </svg>`;
}

const grid=document.getElementById("grid"), page=document.getElementById("page"), order=document.getElementById("order");
SECTIONS.forEach((s,i)=>{
  const el=document.createElement("article"); el.className="card";
  el.innerHTML=`<button class="shot" data-i="${i}">${mock(s,860)}<span class="zoom">크게 보기 ⤢</span></button>
    <h3>${s.t}</h3><p>${s.d}</p>
    <div class="row"><span class="chip${s.pending?" plain":""}">${s.pending?"대기 중":"생성됨"}</span>
    <span class="spacer"></span><button class="btn">${s.pending?"생성":"다시 생성"}</button></div>`;
  grid.appendChild(el);

  if(!s.pending){
    const seam=document.createElement("div"); seam.className="seam";
    seam.innerHTML=`<span class="tag">${String(i+1).padStart(2,"0")} ${s.t}</span>${mock(s,860)}`;
    page.appendChild(seam);
  }
  const li=document.createElement("div"); li.className="li";
  li.innerHTML=`<span class="h"></span><span>${String(i+1).padStart(2,"0")} ${s.t}</span><span class="g">⋮⋮</span>`;
  order.appendChild(li);
});

// 크게 보기 모달
const modal=document.getElementById("modal"), sheet=document.getElementById("msheet");
let cur=0;
function open(i){
  cur=(i+SECTIONS.length)%SECTIONS.length; const s=SECTIONS[cur];
  document.getElementById("mtitle").textContent=s.t;
  document.getElementById("mmeta").textContent=`${cur+1} / ${SECTIONS.length} · 860 × ${s.h}`;
  sheet.innerHTML=mock(s,860); modal.hidden=false;
}
grid.addEventListener("click",e=>{const b=e.target.closest(".shot"); if(b) open(+b.dataset.i);});
document.getElementById("mclose").onclick=()=>modal.hidden=true;
document.getElementById("mprev").onclick=()=>open(cur-1);
document.getElementById("mnext").onclick=()=>open(cur+1);
modal.addEventListener("click",e=>{ if(e.target===modal) modal.hidden=true; });
addEventListener("keydown",e=>{
  if(modal.hidden) return;
  if(e.key==="Escape") modal.hidden=true;
  if(e.key==="ArrowLeft") open(cur-1);
  if(e.key==="ArrowRight") open(cur+1);
});

for(const id of ["view","size","theme"]){
  document.getElementById(id).addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    document.documentElement.dataset[id]=b.dataset.v;
    [...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  });
}
document.documentElement.dataset.view="grid";
document.documentElement.dataset.size="m";
</script>
</body>
</html>
